# High council speaking assignments. One entry per ward per Sunday.
# Dates are YYYY-MM-DD. speakers is a list, even for one person.
# Example:
# - date: 2026-11-08
#   ward: Greenbluff Ward
#   speakers: [Brother John Smith]
#   notes: Companion assignment with the Elders Quorum president
#
# 2027 rotation: no assignments in April or October (general conference) or in
# May or December (stake conference). Topics are set by the group and not shown.
# Past Sundays drop off the /speaking page on their own the day after.
# March is the 21st because the 28th is Easter.
# President McComas and President Barton speak in every ward once. Each high
# councilor speaks 4 times, never in his home ward or the same ward twice.

